name: Ensure consistent coding style and find basic coding errors

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - run: npm install
    - run: npm run lint
